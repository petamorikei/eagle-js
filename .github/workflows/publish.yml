name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs Node.js and pnpm at the versions in mise.toml.
      # Node 26 bundles npm 11.19+, which meets the trusted publishing requirement (npm >= 11.5.1).
      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          # No cache in the release job, to avoid cache poisoning.
          cache: false

      - name: Verify tag matches package.json version
        run: |
          PKG_TAG="v$(node -p "require('./package.json').version")"
          if [ "$PKG_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($PKG_TAG)"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint and format check
        run: pnpm lint

      - name: Run type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build project
        run: pnpm build

      # Authenticates with OIDC trusted publishing (id-token: write); no token needed.
      - name: Publish to npm
        env:
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
        run: npm publish --provenance --access public

      # Created after publishing so a failed publish does not leave a release behind.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Release $GITHUB_REF_NAME" --generate-notes --verify-tag
